<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trigr · 실전 자동매매 성과</title>
<meta name="description" content="실제 계좌에서 자동매매 봇이 만든 성과를 가감 없이 공개합니다. 백테스트가 아닌 실제 체결 기준입니다.">
<style>
  :root{
    --bg:#0f1116; --card:#171a21; --line:#262b35; --ink:#eef1f6;
    --sub:#9aa3b2; --faint:#5b6473; --up:#22c55e; --down:#ef4444; --accent:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
    line-height:1.6;-webkit-font-smoothing:antialiased;padding:24px 16px 60px;
  }
  .wrap{max-width:680px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.3px;color:var(--sub)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px rgba(34,197,94,.15)}
  h1{font-size:23px;font-weight:700;margin:18px 0 4px;letter-spacing:-.4px}
  .lede{color:var(--sub);font-size:14.5px;margin-bottom:22px}

  .hero{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:28px 24px;text-align:center;margin-bottom:14px;
  }
  .hero .cap{color:var(--sub);font-size:13.5px;letter-spacing:.4px}
  .hero .big{font-size:54px;font-weight:800;letter-spacing:-1.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .hero .note{color:var(--faint);font-size:12.5px}
  .hero .status{margin:9px 0 2px}
  .stat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 11px;border-radius:999px}
  .stat .sd{width:7px;height:7px;border-radius:50%}
  .stat.live{background:rgba(34,197,94,.12);color:#22c55e}
  .stat.live .sd{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18);animation:pulse 2s infinite}
  .stat.closed{background:rgba(154,163,178,.10);color:var(--sub)}
  .stat.closed .sd{background:var(--faint)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--sub)}

  .meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .meta .box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px 12px;text-align:center}
  .meta .k{color:var(--sub);font-size:12px;margin-bottom:3px}
  .meta .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 4px;margin-bottom:18px;overflow:hidden}
  .phead{display:flex;justify-content:space-between;align-items:baseline;padding:14px 18px 6px}
  .phead .t{font-weight:700;font-size:15px}
  .phead .s{color:var(--faint);font-size:12px}
  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 18px;font-size:14.5px;text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--sub);font-size:12px;font-weight:600;border-bottom:1px solid var(--line)}
  td:first-child,th:first-child{text-align:left}
  tbody tr{border-bottom:1px solid rgba(38,43,53,.6)}
  tbody tr:last-child{border-bottom:none}
  .nm{font-weight:600}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:7px;vertical-align:middle}
  .tag.KR{background:rgba(59,130,246,.16);color:#7aa7ff}
  .tag.US{background:rgba(168,85,247,.16);color:#c79bff}
  .wbar{height:5px;border-radius:3px;background:var(--accent);opacity:.85;margin-top:5px}

  .hero .sub{color:var(--sub);font-size:13px;margin-top:3px;font-variant-numeric:tabular-nums}
  .chartnote{color:var(--faint);font-size:11.5px;padding:0 18px 12px;line-height:1.5}
  .honest{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.22);border-radius:13px;padding:15px 17px;font-size:13.5px;color:#cdd6e4;margin-bottom:14px}
  .honest b{color:var(--ink)}
  .disc{color:var(--faint);font-size:12px;text-align:center;line-height:1.7}
  .foot{margin-top:14px;color:var(--faint);font-size:11.5px;text-align:center}
  svg{display:block;width:100%;height:auto}
  .loading{text-align:center;color:var(--sub);padding:40px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>TRIGR</div>
  <h1>실전 자동매매 성과</h1>
  <p class="lede">말이 아니라 <b style="color:var(--ink)">실제 계좌의 체결 기록</b>으로 보여드립니다. 백테스트(과거 시뮬레이션)가 아니에요.</p>

  <div id="app"><div class="loading">불러오는 중…</div></div>
</div>

<script>
const $ = (s,el=document)=>el.querySelector(s);
const fmtPct = v => (v>0?"+":"") + v.toFixed(2) + "%";
const cls = v => v>0?"up":(v<0?"down":"flat");

// updated_at(KST) 기준 신선도 — 방문자 시간대와 무관하게 절대시각으로 비교.
// 최근 갱신이면 '실시간', 오래됐으면 '장 마감'으로 표기해 마감 동안 멈춤이 죽은 것처럼 안 보이게.
function freshness(s){
  try{
    const age = (Date.now() - new Date(s.replace(" ","T")+":00+09:00").getTime())/60000;
    return age < 20 ? {live:true, label:"실시간 갱신 중"}
                    : {live:false, label:"장 마감 — 다음 개장 시 갱신"};
  }catch(e){ return {live:false, label:"장 마감 — 다음 개장 시 갱신"}; }
}

function sparkline(history){
  // 데이터가 얇을 땐 숨긴다 — 점 2~3개짜리 라인은 작은 변동을 폭락처럼 과장해 오해를 부름
  if(!history || history.length < 5) return "";
  const W=640,H=120,pad=8;
  const ts = history.map(p=>Date.parse(p.date)), ys = history.map(p=>p.ret_pct);
  const t0 = ts[0], tN = ts[ts.length-1], tspan = (tN-t0)||1;
  // 최소 표시 폭(±2%p) — 0.04% 같은 미세 변동이 화면을 꽉 채우지 않도록
  let minY=Math.min(0,...ys), maxY=Math.max(0,...ys);
  const MINSPAN=4, mid=(minY+maxY)/2;
  if(maxY-minY < MINSPAN){ minY=mid-MINSPAN/2; maxY=mid+MINSPAN/2; }
  const span=(maxY-minY)||1;
  // x = 실제 날짜 비례 — 6/4~7/5 근사 구간이 하루처럼 압축돼 보이지 않도록
  const px = t => pad + (W-2*pad)*((t-t0)/tspan);
  const py = v => pad + (H-2*pad)*(1-(v-minY)/span);
  const pts = history.map((p,i)=>`${px(ts[i])},${py(p.ret_pct)}`).join(" ");
  const last = ys[ys.length-1];
  const col = last>=0 ? "#22c55e" : "#ef4444";
  const zeroY = py(0);
  // 일별 정밀 집계 시작점(2026-07-06) 표식 — 그 앞 구간은 구간 근사(직선)
  const tBase = Date.parse("2026-07-06");
  const baseMark = (tBase>t0 && tBase<tN)
    ? `<line x1="${px(tBase)}" y1="${pad}" x2="${px(tBase)}" y2="${H-pad}" stroke="#5b6473" stroke-width="1" stroke-dasharray="2 4"/>` : "";
  return `<div class="panel"><div class="phead"><span class="t">누적 수익률 추이</span>
    <span class="s">운용 시작 이후 · 익절 포함 · 입출금 효과 제거</span></div>
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="padding:4px 14px 8px">
      <line x1="${pad}" y1="${zeroY}" x2="${W-pad}" y2="${zeroY}" stroke="#262b35" stroke-width="1" stroke-dasharray="3 4"/>
      ${baseMark}
      <polyline fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>
    </svg>
    <div class="chartnote">시간가중 수익률(TWR) — 입금·출금으로 인한 자산 변동을 제거한 순수 운용 성과.
    점선 세로선(7/6) 이전 구간은 입출금 기록 정밀도 한계로 구간 근사입니다.</div></div>`;
}

function tradesPanel(trades){
  if(!trades || !trades.length) return "";
  const rows = trades.map(t=>`
    <tr><td class="nm">${t.name}<span class="tag ${t.mkt}">${t.mkt}</span></td>
      <td>${t.closed.slice(5).replace("-","/")}</td>
      <td>${t.held_days!=null ? t.held_days+"일" : "–"}</td>
      <td class="${cls(t.pct)}">${(t.pct>0?"+":"")+t.pct.toFixed(1)}%</td></tr>`).join("");
  return `<div class="panel">
    <div class="phead"><span class="t">청산 완료 내역</span><span class="s">익절·손절 실현 수익률 · 최근순</span></div>
    <table>
      <thead><tr><th>종목</th><th>청산일</th><th>보유</th><th>실현수익률</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="chartnote">체결가 기준 · 수수료·세금 미반영 · 해외 종목은 현지통화 기준(환차 미포함)</div></div>`;
}

function render(d){
  const c = cls(d.return_pct);
  const fr = freshness(d.updated_at);
  const rows = d.holdings.map(h=>`
    <tr><td class="nm">${h.name}<span class="tag ${h.mkt}">${h.mkt}</span>
      <div class="wbar" style="width:${Math.max(4,h.weight)}%"></div></td>
      <td>${h.weight.toFixed(1)}%</td>
      <td class="${cls(h.pnl_pct)}">${fmtPct(h.pnl_pct)}</td></tr>`).join("");

  $("#app").innerHTML = `
    <div class="hero">
      <div class="cap">누적 수익률 · 실제 체결 · 익절 포함 (시간가중)</div>
      <div class="big ${c}">${fmtPct(d.return_pct)}</div>
      ${d.net_growth_pct!=null ? `<div class="sub">순입금 대비 순자산 성장 <b class="${cls(d.net_growth_pct)}">${fmtPct(d.net_growth_pct)}</b></div>` : ""}
      <div class="status"><span class="stat ${fr.live?'live':'closed'}"><span class="sd"></span>${fr.label}</span></div>
      <div class="note">운용 시작 ${d.inception} · 마지막 업데이트 ${d.updated_at} KST</div>
    </div>

    <div class="meta">
      <div class="box"><div class="k">운용</div><div class="v">${d.days}일차</div></div>
      <div class="box"><div class="k">보유 종목</div><div class="v">${d.n_holdings}개</div></div>
      <div class="box"><div class="k">현금 비중</div><div class="v">${d.cash_weight.toFixed(0)}%</div></div>
    </div>

    ${sparkline(d.history)}

    <div class="panel">
      <div class="phead"><span class="t">보유 종목</span><span class="s">비중 · 종목별 수익률(평가)</span></div>
      <table>
        <thead><tr><th>종목</th><th>비중</th><th>수익률</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="3" style="text-align:center;color:var(--sub);padding:22px">현재 보유 종목 없음 (현금 대기 중)</td></tr>`}</tbody>
      </table>
    </div>

    ${tradesPanel(d.trades)}

    <div class="honest">
      <b>정직하게 밝힙니다.</b> 잃어도 괜찮은 <b>소액 실계좌</b>로 검증 중이라 금액은 공개하지 않고
      수익률·종목·비중만 보여드려요. 상단 수익률은 팔아서 확정한 익절·손절까지 포함하고,
      제가 돈을 더 넣거나 뺀 효과는 제거한 <b>시간가중 수익률</b>입니다(펀드 성과 표기와 같은 방식).
      봇은 코스피200+S&amp;P500의 큰 회사들 중 흐름 좋은 몇 개만 담고
      한 달에 한 번 교체합니다. 체결될 때마다 + 장중 5분마다 자동으로 이 페이지가 갱신돼요.
    </div>

    <p class="disc">※ 투자 권유가 아니라 개인의 운용 기록입니다. 모든 판단과 책임은 본인에게 있습니다.<br>
      과거 수익이 미래 수익을 보장하지 않습니다.</p>
    <p class="foot">데이터: 한국투자증권 계좌 · 자동 생성 · Trigr</p>`;
  document.title = `${fmtPct(d.return_pct)} · Trigr 실전 성과`;
}

fetch("data.json?t=" + Date.now())
  .then(r=>r.json()).then(render)
  .catch(()=>{ $("#app").innerHTML = `<div class="loading">데이터를 불러오지 못했어요. 잠시 후 새로고침 해주세요.</div>`; });
</script>
</body>
</html>
